name: Deploy to GitHub Pages

# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Then run this workflow (Actions → Deploy to GitHub Pages → Run workflow).
# Production hosting is Netlify (netlify.toml); this static export is the fallback for static hosts.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Static export (base path /synforma)
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /synforma
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
