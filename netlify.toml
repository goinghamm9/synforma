# Netlify: Synforma on the Next.js runtime (the optional planner route needs a server).
# The app is the whole repository: no base directory. Netlify reads this file on import.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
