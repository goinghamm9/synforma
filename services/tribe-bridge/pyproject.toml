[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tribe-bridge"
version = "0.1.0"
description = "Synforma bridge: screen recording → predicted average-subject cortical response (TRIBE v2) → stimulus-analysis JSON"
requires-python = ">=3.11"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
# The model itself. CC BY-NC 4.0: research use only. Needs a GPU for practical run times,
# a Hugging Face login, and acceptance of the gated backbone licences (see README).
model = [
  "tribev2 @ git+https://github.com/facebookresearch/tribev2",
  "mne",
  "torch",
]
server = ["fastapi", "uvicorn", "python-multipart"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["tribe_bridge*"]
